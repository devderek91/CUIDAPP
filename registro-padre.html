<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilos.css">
    
    <title>CUIDAPP — Registro padre</title>
</head>
<body>

    <header>
        <h1>CUIDAPP</h1>
        <a href="index.html">← Volver</a>
    </header>

    <section>
        <h2>Busco a alguien de confianza para mis hijos</h2>
        <p>Crea tu cuenta y encuentra canguros verificados cerca de ti.</p>

        <form>
            <p>
                <label>Nombre</label><br>
                <input type="text" id="nombre" placeholder="Tu nombre">
            </p>
            <p>
                <label>Email</label><br>
                <input type="email" id="email" placeholder="tu@email.com">
            </p>
            <p>
                <label>Contraseña</label><br>
                <input type="password" placeholder="Mínimo 8 caracteres">
            </p>
            <p>
                <label>Ciudad</label><br>
                <input type="password" id="password" placeholder="">
            </p>
            <p>
                <button type="button" onclick="validarRegistro()">Crear mi cuenta</button>
            </p>
        </form>
    </section>

    <footer>
        <p>CUIDAPP © 2026 — Barcelona</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
