<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilos.css">
    <title>CUIDAPP — Verificación</title>
</head>
<body>

    <header>
        <h1>CUIDAPP</h1>
        <a href="perfil-nino.html">← Volver</a>
    </header>

    <section>
        <h2>Verificación de identidad</h2>
        <p>Solo necesitamos confirmar quién eres. Tus datos están protegidos.</p>

        <form>

            <h3>Documento de identidad</h3>
            <p>
                <label>DNI o NIE</label><br>
                <input type="text" placeholder="12345678A" maxlength="9">
            </p>
            <p>
                <label>Foto del DNI</label><br>
                <input type="file">
            </p>

            <h3>Teléfono</h3>
            <p>
                <label>Número de teléfono</label><br>
                <input type="tel" placeholder="+34 600 000 000">
            </p>
            <p>Te enviaremos un código de verificación por SMS.</p>

            <p>
                <button type="submit">Verificar mi identidad</button>
            </p>

        </form>
    </section>

    <footer>
        <p>CUIDAPP © 2026 — Barcelona</p>
    </footer>

</body>
</html>
